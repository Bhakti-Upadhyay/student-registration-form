<!DOCTYPE html>
<html>
<head>

<title>Student Course Registration</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<h1>🎓 Student Course Registration Portal</h1>

<nav>

<button onclick="showSection('home')">Home</button>
<button onclick="showSection('register')">Register</button>
<button onclick="showSection('login')">Login</button>
<button onclick="showSection('courses')">Courses</button>

</nav>

</header>


<!-- HOME -->

<section id="home" class="section">

<div class="home-container">

<h2>Welcome to Student Course Portal 🎓</h2>

<p>
Register, explore courses and enroll easily using our online platform.
</p>

<div class="home-buttons">

<button onclick="showSection('register')" class="home-btn">Register Now</button>

<button onclick="showSection('courses')" class="home-btn2">View Courses</button>

</div>

</div>

</section>

<!-- REGISTER -->

<section id="register" class="section hidden">

<div class="card">

<h2>Student Registration</h2>

<form id="registerForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="text" id="enrollment" placeholder="Enrollment Number" required>

<input type="email" id="email" placeholder="Email" required>

<input type="password" id="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

</div>

</section>



<!-- LOGIN -->

<section id="login" class="section hidden">

<div class="card">

<h2>Student Login</h2>

<form id="loginForm">

<input type="email" id="loginEmail" placeholder="Email" required>

<input type="password" id="loginPassword" placeholder="Password" required>

<button type="submit">Login</button>

</form>

</div>

</section>



<!-- COURSES -->

<section id="courses" class="section hidden">

<div class="card">

<h2>Available Courses</h2>

<table id="courseTable">

<thead>

<tr>

<th>Course Name</th>
<th>Course Code</th>
<th>Instructor</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</section>



<script src="js/script.js"></script>

</body>

</html>
